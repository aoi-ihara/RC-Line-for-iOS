name: apply-speech-highlight-change

on:
  push:
    branches:
      - feature/speech-word-highlighting

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply implementation
        run: python3 .github/scripts/apply_speech_highlight.py
      - name: Commit implementation and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "RC Line/Reader/WrappedLinesTextView.swift"
          git commit -m "Add word-level speech highlighting"
          git rm .github/workflows/apply-speech-highlight-change.yml .github/scripts/apply_speech_highlight.py .speech-highlight-trigger .speech-highlight-trigger-2 .speech-highlight-trigger-3 .speech-highlight-trigger-4 || true
          git commit -m "Remove temporary speech highlight workflow"
          git push
