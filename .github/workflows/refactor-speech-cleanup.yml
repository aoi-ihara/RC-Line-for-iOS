name: Refactor speech reading code

on:
  push:
    branches:
      - refactor/speech-reading-cleanup

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/speech-reading-cleanup
          fetch-depth: 0
      - name: Apply speech cleanup
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('RC Line/Reader/WrappedLinesTextView.swift')
          source = path.read_text()

          replacements = [
              ('    @State private var speakingLine = 0\n', ''),
              ('    let synthesizer = AVSpeechSynthesizer()\n', '    @State private var synthesizer = AVSpeechSynthesizer()\n'),
              ('            lineRow(index: index, line: line, rawText: text, scrollProxy: scrollProxy)', '            lineRow(index: index, line: line, scrollProxy: scrollProxy)'),
              ('        index: Int, line: String, rawText: String, scrollProxy: ScrollViewProxy\n', '        index: Int, line: String, scrollProxy: ScrollViewProxy\n'),
              ('                                speakingLine = index\n', ''),
          ]

          for old, new in replacements:
              if old not in source:
                  raise SystemExit(f'Missing expected text: {old!r}')
              source = source.replace(old, new, 1)

          old = '''        if animate {\n            withAnimation(.spring(response: 0.35, dampingFraction: 0.8)) {\n                focusingLine = index\n                wasScrolled = false\n            }\n        } else {\n            wasScrolled = false\n        }\n        \n        speechTask = Task {'''
          new = '''        wasScrolled = false\n        \n        speechTask = Task {'''
          if old not in source:
              raise SystemExit('Missing redundant startSpeaking state update')
          source = source.replace(old, new, 1)

          old = '''                if animate {\n                    withAnimation(.timingCurve(.easeInOut, duration: 0.3)) {\n                        wasScrolled = false\n                    }\n                } else {\n                    wasScrolled = false\n                }\n                \n                if autoScrool {'''
          new = '''                if autoScrool {'''
          if old not in source:
              raise SystemExit('Missing redundant per-line animation')
          source = source.replace(old, new, 1)

          old = '''                if sentence.isEmpty {\n                    i += 1\n                    continue\n                }'''
          new = '''                if sentence.isEmpty {\n                    focusingLine += 1\n                    continue\n                }'''
          if old not in source:
              raise SystemExit('Missing empty-sentence branch')
          source = source.replace(old, new, 1)

          path.write_text(source)
          PY

          rm .github/workflows/refactor-speech-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'RC Line/Reader/WrappedLinesTextView.swift' .github/workflows/refactor-speech-cleanup.yml
          git commit -m 'refactor: clean up speech reading state' || exit 0
          git push origin refactor/speech-reading-cleanup
