name: Apply feature display mode update

on:
  push:
    branches: [feature/feature-display-mode-both]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update feature display mode
        run: |
          python3 - <<'PY'
          from pathlib import Path

          settings = Path('RC Line/Settings/FeatureSettingsView.swift')
          text = settings.read_text()
          old = '''                        Text("feature_display_mode_buttons").tag(0)\n                        Text("feature_display_mode_gestures").tag(1)'''
          new = '''                        Text("feature_display_mode_buttons").tag(0)\n                        Text("feature_display_mode_gestures").tag(1)\n                        Text("feature_display_mode_both").tag(2)'''
          if old not in text:
              raise SystemExit('settings pattern not found')
          settings.write_text(text.replace(old, new, 1))

          content = Path('RC Line/ContentView.swift')
          text = content.read_text()
          old = '''                        VStack {\n                            Spacer()\n                            readerToolbar\n                        }\n                        .frame(maxWidth: .infinity)\n                        .padding(.horizontal, 35)'''
          new = '''                        if featureDisplayMode != 1 {\n                            VStack {\n                                Spacer()\n                                readerToolbar\n                            }\n                            .frame(maxWidth: .infinity)\n                            .padding(.horizontal, 35)\n                        }'''
          if old not in text:
              raise SystemExit('toolbar pattern not found')
          content.write_text(text.replace(old, new, 1))

          old = 'minimumDistance: featureDisplayMode == 1 ? 10 : .greatestFiniteMagnitude'
          new = 'minimumDistance: featureDisplayMode == 0 ? .greatestFiniteMagnitude : 10'
          if old not in text:
              raise SystemExit('gesture minimum distance pattern not found')
          content.write_text(content.read_text().replace(old, new, 1))

          old = 'guard featureDisplayMode == 1 else { return }'
          new = 'guard featureDisplayMode != 0 else { return }'
          content.write_text(content.read_text().replace(old, new, 1))

          old = '''            guard featureDisplayMode == 1 else {\n                dragOffset = 0\n                return\n            }'''
          new = '''            guard featureDisplayMode != 0 else {\n                dragOffset = 0\n                return\n            }'''
          text = content.read_text()
          if old not in text:
              raise SystemExit('gesture end pattern not found')
          content.write_text(text.replace(old, new, 1))
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'RC Line/Settings/FeatureSettingsView.swift' 'RC Line/ContentView.swift'
          git commit -m "feat: add combined feature display mode"
          git push

      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/apply-feature-display-mode.yml
          git commit -m "chore: remove temporary workflow"
          git push
